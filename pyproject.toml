[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labelled-array"
version = "0.3.0"
description = "N-dimensional arrays carrying named, labelled dimensions, with lossless DataFrame round trips."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ronald MacEachern" }]
keywords = ["numpy", "labelled-array", "dimensions", "pandas", "polars"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
docs = ["sphinx>=7.0", "sphinx-gallery>=0.17", "furo>=2024.8"]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
jax = ["jax>=0.4"]
torch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/ronaldBuddys/labelled-array"

# pandas and polars are here rather than in an extra because the `engine` and
# `backend` fixtures parametrise over *installed* libraries: without them the
# adapter tests silently collect zero cases instead of failing.
[dependency-groups]
dev = [
    "pandas>=2.0",
    "polars>=1.0",
    # jax and torch are registered backends, and the suite asserts every
    # registered backend is actually installed
    # (test_every_registered_backend_is_installed_in_this_environment), so they
    # are dev requirements rather than optional extras.
    "jax>=0.4",
    "torch>=2.0",
    "pytest>=8",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff==0.16.4",
]

# The suite never touches a GPU. Left to PyPI, Linux resolves the CUDA build of
# torch and drags in ~40 nvidia wheels (multiple GB) that CI would download on
# every run. macOS wheels are CPU-only already, so the override is Linux-scoped.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/labelled_array"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
# E501 is the formatter's job, not the linter's: `ruff format` owns line width,
# and what it cannot wrap (long string literals, URLs, docstring tables) is not
# worth hand-breaking. CI still gates width via `ruff format --check`.
ignore = [
    "D107",
    "D203",
    "D213",
    "E501",
    # Deferred, not dismissed: 45 public methods and 7 magic methods predate
    # docstring linting here. Writing them all in one pass produces filler
    # rather than documentation; drop these as the API gets documented.
    "D102",
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]
"examples/*" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["labelled_array"]
