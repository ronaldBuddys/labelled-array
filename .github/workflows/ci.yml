name: CI

on:
  pull_request:
  # No push to main: the PR's run already tested what the merge lands, and repeating
  # it after every merge was over a third of the account's Actions minutes. To check
  # main itself, run this workflow by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read this repository. The private siblings are
# fetched with SIBLING_CHECKOUT_TOKEN, never with GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --locked --all-extras

      - name: Build docs
        # -W: warnings are errors. Examples are executed here; see docs/building.rst.
        run: uv run make -C docs html

      - name: Upload the built docs
        # No hosting (a Pages site from a private repo is public); the HTML is a
        # private artifact on the run, for a reviewer to download and open.
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
